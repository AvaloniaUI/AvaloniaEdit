name: Nightly

on:
    push:
        branches: [ "master" ]
    pull_request:
        branches: [ "master" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    nightly:
        uses: AvaloniaUI/build-common/.github/workflows/library-cicd.yml@main
        with:
            runs_on: windows-latest
            global_json_file: global.json
            nuget_feed: ${{ vars.NIGHTLY_FEED_UPLOAD_URL }}
        secrets:
            nuget_api_key: ${{ secrets.NIGHTLY_FEED_API_KEY }}
